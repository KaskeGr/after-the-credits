let currentId=null;function current(){return db.items.find(i=>i.id===currentId)}function editEntry(){let i=current();editing=i.id;draft={...i};showAdd()}function removeEntry(){if(confirm('Να διαγραφεί ο τίτλος και η προσωπική σου αξιολόγηση;')){db.items=db.items.filter(i=>i.id!==currentId);closeModal();commit('Διαγράφηκε.')}}function joinTitle(){let i=current(),r=ensure(i,detailPerson);r.added=true;r.status=i.type==='tv'?'watching':'planned';commit();detail(i.id,detailPerson)}function setStatus(v){let i=current(),r=ensure(i,detailPerson);r.status=v;commit();detail(i.id,detailPerson)}function setWatchDate(v){ensure(current(),detailPerson).date=v;commit()}

async function legacy06_refreshSeries(){let i=current(),p=detailPerson;if(!i.mazeId){modal('Σύνδεση με TVmaze',`<div class="tools"><input id="linkQuery" value="${esc(i.title)}"><button class="btn" onclick="linkSearch()">Αναζήτηση</button></div><div id="linkResults"></div>`);linkSearch();return}let token=modalToken;toast('Ενημέρωση στοιχείων…');try{let d=await mazeFull(i.mazeId);mergeMaze(i,d);commit('Τα στοιχεία ενημερώθηκαν.');if(token===modalToken)detail(i.id,p)}catch(e){toast('Δεν έγινε ενημέρωση: '+e.message)}}function mergeMaze(i,d){let manual=(i.seasons||[]).filter(s=>s.manual&&!d.seasons.some(x=>x.number===s.number)),oldE=(i.episodes||[]).filter(e=>e.manual&&!d.episodes.some(x=>epKey(x)===epKey(e)));Object.assign(i,{mazeId:d.mazeId,sourceUrl:d.sourceUrl,sourceStatus:d.sourceStatus,poster:d.poster||i.poster,plot:i.plot||d.plot,plotProvider:i.plot?i.plotProvider:d.plotProvider,plotSource:i.plot?i.plotSource:d.plotSource,imdbId:i.imdbId||d.imdbId,genres:d.genres.length?d.genres:i.genres,episodes:[...d.episodes,...oldE].sort((a,b)=>a.season-b.season||a.number-b.number),seasons:[...d.seasons,...manual],updated:d.updated})}async function legacy06_linkSearch(){let token=modalToken,q=$('linkQuery').value;$('linkResults').textContent='Αναζήτηση…';try{let a=await json('https://api.tvmaze.com/search/shows?q='+encodeURIComponent(q));if(token!==modalToken)return;$('linkResults').innerHTML=a.slice(0,12).map(({show:s})=>`<div class="row"><span>${esc(s.name)} · ${esc(s.premiered||'')}</span><button class="btn" onclick="linkChoose(${s.id})">Σύνδεση</button></div>`).join('')||'Δεν βρέθηκε σειρά.'}catch(e){if(token===modalToken)$('linkResults').textContent=e.message}}async function legacy06_linkChoose(id){let i=current(),p=detailPerson,token=modalToken;try{mergeMaze(i,await mazeFull(id));commit('Συνδέθηκε με TVmaze.');if(token===modalToken)detail(i.id,p)}catch(e){toast(e.message)}}
function manualSeason(){modal('Χειροκίνητη σεζόν',`<p class="muted small">Για νέα επιβεβαιωμένη σεζόν, βάλε επίσημη πηγή και την ημερομηνία αν υπάρχει. Για ήδη διαθέσιμη σεζόν, βάλε ημερομηνία πρεμιέρας και πλήθος επεισοδίων μόνο αν είναι γνωστά.</p><form onsubmit="saveSeason(event)"><div class="fields"><label class="field">Αριθμός σεζόν<input name="season" type="number" required min="1" max="200"></label><label class="field">Πρεμιέρα (αν είναι γνωστή)<input name="premiere" type="date"></label><label class="field">Πλήθος επεισοδίων (αν είναι γνωστό)<input name="count" type="number" min="0" max="500"></label><label class="field">Επίσημη πηγή HTTPS<input name="source" type="url" placeholder="https://..."></label><label class="field full"><span><input type="checkbox" name="confirmed"> Επιβεβαιωμένη νέα σεζόν</span></label><label class="field full">Ημερομηνίες επεισοδίων (προαιρετικά, μία ανά γραμμή, YYYY-MM-DD)<textarea name="dates"></textarea></label></div><button class="btn primary" type="submit">Αποθήκευση</button><button class="btn" type="button" onclick="detail(currentId,detailPerson)">Πίσω</button></form>`)}function saveSeason(e){e.preventDefault();let f=new FormData(e.target),i=current(),n=Number(f.get('season')),dt=f.get('premiere'),count=Number(f.get('count'))||0,confirmed=f.has('confirmed'),source=f.get('source'),dates=String(f.get('dates')).split(/\r?\n/).map(x=>x.trim());if((confirmed||dt>today())&&!safe(source)){toast('Για μελλοντική σεζόν χρειάζεται επίσημη πηγή HTTPS.');return}i.seasons??=[];i.episodes??=[];i.seasons=i.seasons.filter(s=>s.number!==n);i.seasons.push({number:n,premiereDate:dt,count,confirmed,source,manual:true});for(let j=1;j<=count;j++){let old=i.episodes.find(x=>x.season===n&&x.number===j),day=/^\d{4}-\d{2}-\d{2}$/.test(dates[j-1])?dates[j-1]:(j===1?dt:'');if(old){if(day)old.airdate=day}else i.episodes.push({season:n,number:j,name:'Επεισόδιο '+j,airdate:day,manual:true})}i.episodes.sort((a,b)=>a.season-b.season||a.number-b.number);commit function legacy06_hydratePosters(root=document){let n=epoch;let load=el=>{if(el.dataset.posterLoading==='1'||el.querySelector('img'))return;el.dataset.posterLoading='1';let {posterTitle:t,posterType:type,posterYear:y,posterImdb:imdbId,posterMaze:maze}=el.dataset,k=[type,t,y,imdbId,maze].join('|');let apply=x=>{if(n!==epoch||!el.isConnected||!x?.poster||el.querySelector('img'))return;let u=httpsURL(x.poster);if(!u)return;let im=document.createElement('img');im.src=u;im.alt=t+' — αφίσα';im.loading='lazy';im.referrerPolicy='no-referrer';im.onerror=()=>{im.remove();el.dataset.broken='1'};el.append(im);if(x.imageCredit&&!el.querySelector('.image-credit'))el.insertAdjacentHTML('beforeend',creditLink(x.imageCredit))};let promise=posterCache.get(k);if(!promise){promise=posterQueue.then(()=>{if(n!==epoch)return null;return enrichMetadata({title:t,type,year:Number(y)||'',imdbId,mazeId:Number(maze)||undefined})}).catch(()=>null);posterCache.set(k,promise);posterQueue=promise.then(()=>new Promise(r=>setTimeout(r,200)));promise.then(x=>{if(!x?.poster)posterCache.delete(k)})}promise.then(apply)};let els=[...root.querySelectorAll('.poster[data-poster-title]')].filter(el=>!el.querySelector('img')&&!el.dataset.posterLoading);if(typeof IntersectionObserver==='undefined'){els.slice(0,12).forEach(load);return}let io=new IntersectionObserver(entries=>{for(let e of entries)if(e.isIntersecting){io.unobserve(e.target);load(e.target)}},{rootMargin:'150px'});els.forEach(el=>io.observe(el))}

// v0.8 runtime accounting. Never treat missing durations as zero or invent episode runtimes.
function minutes(v){let n=Number(v);return Number.isFinite(n)&&n>0&&n<=1500?n:0}
function durationText(n){n=Math.round(n);let h=Math.floor(n/60),m=n%60;return h?(h+'ω'+(m?' '+m+'λ':'')):m+'λ'}
function seriesMean(i){let a=(i.episodes||[]).filter(aired).map(e=>minutes(e.runtime)).filter(Boolean);return a.length?{value:avg(a),exact:a.length===(i.episodes||[]).filter(aired).length}: {value:minutes(i.runtime),exact:false}}

function durationSummary(episodes,fallback=0){let total=0,estimated=0,unknown=0,known=0;for(let e of episodes){let v=minutes(e.runtime);if(v){total+=v;known++}else if(minutes(fallback)){total+=fallback;estimated++}else unknown++}return {total,estimated,unknown,known,count:episodes.length}}
function mergeTimes(a,b){return {total:a.total+b.total,estimated:a.estimated+b.estimated,unknown:a.unknown+b.unknown,known:a.known+b.known,count:a.count+b.count}}
function timeLabel(t){if(!t.count)return '0λ';if(!t.known&&!t.estimated)return '—';return `${t.estimated?'≈ ':t.unknown?'≥ ':''}${durationText(t.total)}${t.unknown&&t.estimated?' + ?':''}`}
function timeMeta(t){return t.unknown?`${t.unknown} χωρίς διάρκεια${t.estimated?' · '+t.estimated+' εκτιμώμενες':''}`:t.estimated?`${t.estimated} εκτιμώμενες διάρκειες`:t.count?'Καταγεγραμμένες διάρκειες':'Καμία προβολή'}
function seriesTimes(i){let es=(i.episodes||[]).filter(aired),fallback=seriesMean(i).value;return {watched:durationSummary(es.filter(e=>seen(i,profile,e)),fallback),remaining:durationSummary(es.filter(e=>!seen(i,profile,e)),fallback),all:durationSummary(es,fallback)}}
